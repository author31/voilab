name: cup_stacking

img_obs_horizon: 2
low_dim_obs_horizon: 2
action_horizon: 16
obs_down_sample_steps: 1

dataset_path: &dataset_path /home/hcis-s17/author_workdir/voilab/datasets/0409_high_variance/simulation_dataset.zarr.zip

shape_meta: &shape_meta
  obs:
    camera0_rgb:
      shape: [3, 224, 224]
      type: rgb
      horizon: ${task.img_obs_horizon}
      latency_steps: 0
      down_sample_steps: ${task.obs_down_sample_steps}
    robot0_eef_pos:
      shape: [3]
      type: low_dim
      horizon: ${task.low_dim_obs_horizon}
      latency_steps: 0
      down_sample_steps: ${task.obs_down_sample_steps}
    robot0_eef_rot_axis_angle:
      shape: [3]
      type: low_dim
      horizon: ${task.low_dim_obs_horizon}
      latency_steps: 0
      down_sample_steps: ${task.obs_down_sample_steps}
    robot0_gripper_width:
      shape: [1]
      type: low_dim
      horizon: ${task.low_dim_obs_horizon}
      latency_steps: 0
      down_sample_steps: ${task.obs_down_sample_steps}
  action:
    shape: [7]
    horizon: ${task.action_horizon}
    latency_steps: 0
    down_sample_steps: ${task.obs_down_sample_steps}

dataset:
  _target_: diffusion_policy.dataset.isaacsim_replay_dataset.IsaacsimReplayDataset
  shape_meta: *shape_meta
  dataset_path: *dataset_path
  action_padding: False
  temporally_independent_normalization: False
  seed: 42
  val_ratio: 0.02
